<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#281052"><title>Podio Karaoke Battle</title>
<style>
:root{--violet:#6c2bd9;--pink:#e43b91;--gold:#ffc83d;--silver:#dfe5ef;--bronze:#d99055;--ink:#fff;--mut:#d9cbea}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 50% 10%,#6b248a 0,#32135a 38%,#12091f 100%);overflow-x:hidden}.wrap{max-width:1500px;margin:auto;padding:28px}.head{text-align:center}.head h1{font-size:clamp(34px,5vw,76px);margin:0;background:linear-gradient(90deg,var(--gold),#fff,var(--pink));-webkit-background-clip:text;color:transparent}.head p{font-size:clamp(16px,2vw,28px);color:var(--mut);margin:6px 0 22px}.status{text-align:center;color:var(--mut);min-height:28px}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:16px 0 22px}button{border:0;border-radius:999px;padding:12px 18px;font:800 16px inherit;cursor:pointer;background:#fff;color:#351253}button.primary{background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff}button:disabled{opacity:.45;cursor:not-allowed}.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:18px;align-items:end;min-height:440px}.place{position:relative;border:1px solid #ffffff26;border-radius:26px 26px 12px 12px;padding:24px 16px;text-align:center;box-shadow:0 20px 45px #0005;transition:all .7s ease;opacity:0;transform:translateY(70px) scale(.92);overflow:hidden}.place.show{opacity:1;transform:none}.place.first{min-height:410px;background:linear-gradient(180deg,#ffcf4c33,#6d451633)}.place.second{min-height:335px;background:linear-gradient(180deg,#e5ebf433,#6d748033)}.place.third{min-height:280px;background:linear-gradient(180deg,#df955c33,#75462a33)}.medal{font-size:64px}.position{font-size:clamp(34px,4vw,58px);font-weight:1000}.team{font-size:clamp(24px,3vw,46px);font-weight:950;margin:8px 0}.members{font-size:clamp(14px,1.4vw,20px);color:var(--mut);min-height:28px}.score{font-size:clamp(30px,4vw,60px);font-weight:1000;margin-top:12px}.breakdown{color:var(--mut);font-size:14px}.hidden-name .team,.hidden-name .members,.hidden-name .score,.hidden-name .breakdown{filter:blur(16px);user-select:none}.others{margin-top:22px;display:grid;gap:9px}.other{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;background:#ffffff12;border:1px solid #ffffff1d;border-radius:15px;padding:12px 18px}.other b{font-size:20px}.empty{text-align:center;padding:70px 20px;color:var(--mut);font-size:24px}.brand{position:fixed;right:18px;bottom:14px;z-index:30;background:#ffffff10;border:1px solid #ffffff26;border-radius:14px;padding:9px 13px;font-weight:950}.brand span{background:linear-gradient(90deg,#ffe397,#ef87c7);-webkit-background-clip:text;color:transparent}.eventname{font-size:clamp(25px,3vw,46px);font-weight:900;color:#fff;margin:4px 0}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.piece{position:absolute;top:-30px;width:12px;height:20px;animation:fall 4s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(960deg)}}@media(max-width:800px){.wrap{padding:14px}.podium{grid-template-columns:1fr;min-height:auto}.place{min-height:240px!important}.first{order:1}.second{order:2}.third{order:3}.other{grid-template-columns:45px 1fr}.other .score{grid-column:2;font-size:24px}}
</style></head><body><div class="wrap"><header class="head"><h1>🎤 KARAOKE BATTLE</h1><div id="partyName" class="eventname">Evento</div><p>CLASSIFICA FINALE</p></header><div class="controls"><button id="refresh">Aggiorna dati</button><button id="reveal" class="primary">Svela 3° posto</button><button id="all">Mostra tutto</button><button id="fullscreen">Schermo intero</button></div><div id="status" class="status"></div><main id="content"><div class="empty">Caricamento classifica…</div></main></div><div class="brand">🎤 <span>RICKY'S HAPPY PARTY</span></div><div id="confetti" class="confetti"></div><script src="config.js"></script><script>
(()=>{const cfg=window.KARAOKE_CONFIG||{};let rows=[],step=0;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{$('#status').textContent='Aggiornamento in corso…';const er=await fetch(cfg.supabaseUrl+'/rest/v1/configurazione_evento?select=nome_evento&id=eq.1',{headers:{apikey:cfg.supabaseAnonKey,Authorization:'Bearer '+cfg.supabaseAnonKey}});if(er.ok){const ev=await er.json();$('#partyName').textContent=ev?.[0]?.nome_evento||'Karaoke Party'}const r=await fetch(cfg.supabaseUrl+'/rest/v1/rpc/classifica_pubblica',{method:'POST',headers:{apikey:cfg.supabaseAnonKey,Authorization:'Bearer '+cfg.supabaseAnonKey,'Content-Type':'application/json'},body:'{}'});const t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}if(!r.ok)throw new Error(d?.message||'Impossibile caricare la classifica');rows=Array.isArray(d)?d:[];step=0;render();$('#status').textContent=rows.length?'Classifica pronta · '+rows.length+' squadre complete':'Nessuna squadra ha ancora tutti i punteggi completi.'}catch(e){$('#content').innerHTML='<div class="empty">'+esc(e.message)+'</div>';$('#status').textContent=''}}
function card(x,pos,cls,medal){return `<section class="place ${cls} hidden-name" data-pos="${pos}"><div class="medal">${medal}</div><div class="position">${pos}°</div><div class="team">${esc(x.nome)}</div><div class="members">${esc(x.componenti||'')}</div><div class="score">${Number(x.punteggio_totale).toFixed(2)} / 15</div><div class="breakdown">Pubblico ${Number(x.media_pubblico).toFixed(2)} · Giuria ${Number(x.media_giuria).toFixed(2)} · KaraFun ${Number(x.karafun_normalizzato).toFixed(2)}</div></section>`}
function render(){if(rows.length<3){$('#content').innerHTML='<div class="empty">Servono almeno 3 squadre complete per mostrare il podio.</div>';$('#reveal').disabled=true;return}const other=rows.slice(3).map((x,i)=>`<div class="other"><b>${i+4}°</b><div><b>${esc(x.nome)}</b><div class="breakdown">Pubblico ${Number(x.media_pubblico).toFixed(2)} · Giuria ${Number(x.media_giuria).toFixed(2)} · KaraFun ${Number(x.karafun_normalizzato).toFixed(2)}</div></div><div class="score">${Number(x.punteggio_totale).toFixed(2)}</div></div>`).join('');$('#content').innerHTML=`<div class="podium">${card(rows[1],2,'second','🥈')}${card(rows[0],1,'first','🥇')}${card(rows[2],3,'third','🥉')}</div><div class="others" style="display:none">${other}</div>`;updateButton()}
function reveal(){if(step===0){show(3);step=1}else if(step===1){show(2);step=2}else if(step===2){show(1);step=3;confetti()}else{document.querySelector('.others').style.display='grid';step=4}updateButton()}
function show(n){const el=document.querySelector(`[data-pos="${n}"]`);if(el){el.classList.add('show');setTimeout(()=>el.classList.remove('hidden-name'),250)}}function updateButton(){const labels=['Svela 3° posto','Svela 2° posto','Svela 1° posto','Mostra gli altri','Tutto mostrato'];$('#reveal').textContent=labels[step];$('#reveal').disabled=step>=4}
function showAll(){[3,2,1].forEach(show);const o=document.querySelector('.others');if(o)o.style.display='grid';step=4;updateButton();confetti()}
function confetti(){const c=$('#confetti'),colors=['#ffc83d','#e43b91','#6c2bd9','#fff','#43d6a3'];c.innerHTML='';for(let i=0;i<100;i++){const p=document.createElement('i');p.className='piece';p.style.left=Math.random()*100+'%';p.style.background=colors[i%colors.length];p.style.animationDelay=Math.random()*1.2+'s';p.style.transform=`rotate(${Math.random()*360}deg)`;c.appendChild(p)}setTimeout(()=>c.innerHTML='',5500)}
$('#refresh').onclick=load;$('#reveal').onclick=reveal;$('#all').onclick=showAll;$('#fullscreen').onclick=()=>document.documentElement.requestFullscreen?.();document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();reveal()}});load()})();
</script></body></html>
